# Levanta el entorno completo del Sprint 1 con un solo comando:
#   docker compose up --build
# Solo la base de datos (para correr la app desde el IDE):
#   docker compose up -d mysql

services:
  mysql:
    image: mysql:8.4
    container_name: logitrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-logitrack_shipments}
      MYSQL_USER: ${DB_USER:-logitrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:-logitrack}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  shipment-service:
    build: .
    image: logitrack/daas-proyecto-final:latest
    container_name: logitrack-shipment-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-logitrack_shipments}
      DB_USER: ${DB_USER:-logitrack}
      DB_PASSWORD: ${DB_PASSWORD:-logitrack}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql-data:
