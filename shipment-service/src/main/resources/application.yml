# La configuración de este servicio vive en el repositorio logitrack-config
# y la entrega el config-server al arrancar (S2-04).
# Acá solo queda lo necesario para saber quién es el servicio y dónde buscar su configuración.
spring:
  application:
    name: shipment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
