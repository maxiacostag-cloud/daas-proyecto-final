# Tests de courier-service: H2 en memoria, sin MySQL ni config-server.
spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:logitrack_couriers;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Mismo secreto con el que los tests firman los JWT (ver JwtTestSupport)
jwt.secret=ClaveSecretaDeTestSuperSeguraParaTestsUnitariosLogiTrack2026!
