spring.application.name=courier-service
server.port=${SERVER_PORT:8082}

# Spring Cloud Config: opcional para poder levantar el servicio sin el config-server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Base de datos propia del microservicio (el esquema se define en S2-02)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:logitrack_couriers}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:logitrack}
spring.datasource.password=${DB_PASSWORD:logitrack}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
