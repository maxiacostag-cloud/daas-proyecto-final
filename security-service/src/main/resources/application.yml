server:
  port: 8083

spring:
  application:
    name: security-service

  # Configuración para Spring Cloud Config Client
  config:
    import: "optional:configserver:http://localhost:8888/"

  datasource:
    # Igual que en el resto del monorepo: los valores reales llegan por variables de entorno
    # (docker-compose define DB_HOST=mysql y DB_PORT=3306). Nunca credenciales en el repo.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:logitrack_security_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:logitrack}
    password: ${DB_PASSWORD:logitrack}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:ClaveSecretaSuperSeguraParaFirmarTokensJWTLogiTrack2026!}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
