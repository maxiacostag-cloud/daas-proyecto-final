server:
  port: 8083

spring:
  application:
    name: security-service

  # Configuración para Spring Cloud Config Client
  config:
    import: "optional:configserver:http://localhost:8888/"

  datasource:
    url: jdbc:mysql://localhost:3306/logitrack_security_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 15026
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:ClaveSecretaSuperSeguraParaFirmarTokensJWTLogiTrack2026!}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
