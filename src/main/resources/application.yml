# Configuración del Servidor
server.port=8080
  
  # Nombre de la Aplicación
spring.application.name=shipment-service
  
  # Conexión a MySQL en Docker (Puerto 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/logitrack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  
  # Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
  
  # Configuración Swagger UI / OpenAPI 3
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html